[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-editor"
version = "0.1.0"
description = "A lightweight desktop Markdown editor built with Python and PySide6."
requires-python = ">=3.11"

dependencies = [
    "PySide6",
    "markdown-it-py",
]

[project.scripts]
markdown-editor = "markdown_editor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

